spring.application.name=chatbot-service

spring.cloud.discovery.enabled=true
server.port=8087
spring.cloud.config.enabled=false

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8085/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8086/mcp
spring.ai.openai.api-key=${GROQ_API_KEY}
discord.bot.token=${DISCORD_BOT_TOKEN}
eureka.client.jersey.enabled=false
telegram.username=EbankMiryBot